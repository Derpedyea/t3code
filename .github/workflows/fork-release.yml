name: Fork Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: X.Y.Z-derped.YYYYMMDD.N or X.Y.Z-nightly.YYYYMMDD.N"
        required: true
        type: string
      upstream_nightly:
        description: "Upstream nightly tag (set by the sync workflow; promotes passing builds to main)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Derpedyea/t3code'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - id: version
        name: Validate fork version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          UPSTREAM_NIGHTLY: ${{ inputs.upstream_nightly }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(derped|nightly)\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "Use X.Y.Z-derped.YYYYMMDD.N or X.Y.Z-nightly.YYYYMMDD.N." >&2
            exit 1
          fi
          channel=latest
          if [[ "$RELEASE_VERSION" == *-nightly.* ]]; then channel=nightly; fi
          if [[ -n "$UPSTREAM_NIGHTLY" ]] && { [[ "$channel" != nightly ]] || [[ ! "$UPSTREAM_NIGHTLY" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; }; then
            echo "Upstream sync requires a valid nightly tag and nightly version." >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Check out release commit without credentials
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      # The deploy key also handles candidates that change workflow files.
      - name: Pin release tag
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_SYNC_SSH_KEY: ${{ secrets.FORK_SYNC_SSH_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/sync-fork-nightly.cjs pin-tag

  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Typecheck affected workspaces
        run: vp run --concurrency-limit 2 --filter t3 --filter @t3tools/web --filter @t3tools/mobile --filter @t3tools/desktop --filter effect-acp --filter @t3tools/contracts --filter @t3tools/shared typecheck
      - name: Test provider settings, Devin ACP, and desktop identity
        run: |
          vp test run \
            apps/desktop/src/app/DesktopAppIdentity.test.ts \
            apps/desktop/src/app/DesktopEnvironment.test.ts \
            apps/desktop/src/app/DesktopClerk.test.ts \
            apps/web/src/components/settings/*.test.ts* \
            apps/web/src/components/chat/composerProviderState.test.tsx \
            apps/web/src/components/chat/ModelPickerContent.test.ts \
            apps/web/src/modelSelection.test.ts \
            apps/mobile/src/lib/modelOptions.test.ts \
            apps/mobile/src/lib/providerOptions.test.ts \
            apps/server/src/provider/{Drivers,Layers,acp}/Devin*.test.ts \
            apps/server/src/provider/Layers/ProviderRegistry.test.ts \
            apps/server/src/serverSettings.test.ts \
            packages/effect-acp/src

  wsl_runtime:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick
      - name: Align bundled package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Build server and web bundle
        run: vp run build:desktop
      - name: Build resource monitor for the WSL runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp "native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"
      - name: Build Linux CLI single-executable
        shell: bash
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Build Linux CLI archive for WSL
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$RELEASE_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor/linux-x64" \
            --output-dir wsl-runtime
      - name: Smoke-test Linux CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive wsl-runtime/* --expect-version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: fork-wsl-runtime
          path: wsl-runtime/*
          if-no-files-found: error

  build:
    needs: [prepare, wsl_runtime]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick
      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer failed: $($proc.ExitCode)"
          }
      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: fork-wsl-runtime
          path: wsl-runtime
      - name: Align bundled package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Build unsigned desktop package
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          args=(--platform "$BUILD_PLATFORM" --target "$BUILD_TARGET" --arch "$BUILD_ARCH" --build-version "$RELEASE_VERSION" --verbose)
          if [[ "$BUILD_PLATFORM" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-"$BUILD_ARCH".tar.gz)
          fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect installers and updater metadata
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release-publish
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.AppImage release/*.exe release/*.blockmap release/latest*.yml release/nightly*.yml)
          if ((${#files[@]} == 0)); then
            echo "No desktop artifacts were produced." >&2
            exit 1
          fi
          cp "${files[@]}" release-publish/
          if [[ "$BUILD_PLATFORM" == "mac" && "$BUILD_ARCH" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  publish:
    needs: [prepare, verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      UPSTREAM_NIGHTLY: ${{ inputs.upstream_nightly }}
    steps:
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No CI run found for $GITHUB_SHA. Push the commit to main before releasing." >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Check out release history without credentials
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - uses: actions/download-artifact@v8
        with:
          pattern: fork-desktop-*
          merge-multiple: true
          path: release-assets
      - name: Merge macOS updater manifests
        run: node scripts/merge-update-manifests.ts --platform mac "release-assets/$UPDATE_CHANNEL-mac.yml" "release-assets/$UPDATE_CHANNEL-mac-x64.yml"
      - name: Prepare release notes and checksums
        run: |
          rm "release-assets/$UPDATE_CHANNEL-mac-x64.yml"
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat > release-notes.md <<EOF
          Personal fork build from commit $GITHUB_SHA, with grouped provider settings and Devin ACP support.

          Downloads: Linux x64 AppImage, Windows x64 installer, and macOS Apple Silicon / Intel DMGs and update ZIPs.

          These builds are unsigned. They bundle their own server and check Derpedyea/t3code for desktop updates. This release does not publish the upstream npm package or include upstream T3 Connect cloud credentials; use the local server or pair directly with your own server.
          EOF
          if [[ -n "$UPSTREAM_NIGHTLY" ]]; then
            printf '\nUpstream nightly: `%s`\n' "$UPSTREAM_NIGHTLY" >> release-notes.md
            printf '\nChoose the Nightly update channel to receive these builds.\n' >> release-notes.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: T3 Code (Derped fork) ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ needs.prepare.outputs.channel == 'nightly' }}
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Fast-forward fork main after all checks and builds pass
        if: inputs.upstream_nightly != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_SYNC_SSH_KEY: ${{ secrets.FORK_SYNC_SSH_KEY }}
        run: node .github/scripts/sync-fork-nightly.cjs promote
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.channel == 'nightly' }}
          IS_LATEST: ${{ needs.prepare.outputs.channel == 'latest' }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false --prerelease="$IS_NIGHTLY" --latest="$IS_LATEST"
