name: Sync Upstream Nightly

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      retry:
        description: Rebuild the latest nightly even if it was already published
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: fork-nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Derpedyea/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Check release metadata before cloning or installing the build toolchain.
      # The orchestrator checks again before merging, including after queued runs.
      - name: Check for an unpublished upstream nightly
        id: check
        uses: actions/github-script@v8
        env:
          RETRY_NIGHTLY: ${{ inputs.retry }}
        with:
          script: |
            if (process.env.RETRY_NIGHTLY === 'true') return true;
            const { data: upstream } = await github.rest.repos.listReleases({
              owner: 'pingdotgg', repo: 't3code', per_page: 100,
            });
            const nightly = upstream
              .filter(release => !release.draft && release.published_at &&
                /^v\d+\.\d+\.\d+-nightly\.\d{8}\.\d+$/.test(release.tag_name))
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0];
            if (!nightly) throw new Error('No published upstream nightly found.');
            const { data: releases } = await github.rest.repos.listReleases({
              ...context.repo, per_page: 100,
            });
            const published = releases.some(release =>
              !release.draft && release.published_at &&
              release.body?.includes(`Upstream nightly: \`${nightly.tag_name}\``));
            core.info(published
              ? `${nightly.tag_name} is already published; skipping sync.`
              : `${nightly.tag_name} needs integration; starting sync.`);
            return !published;
      # Public clone: no stored GitHub credentials for the repair process to inherit.
      - name: Check out fork without credentials
        if: steps.check.outputs.result == 'true'
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin main
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@v1
        if: steps.check.outputs.result == 'true'
        with:
          node-version-file: package.json
          run-install: false
      # Keep the running orchestrator outside the merge and the agent's edits.
      - name: Sync, check, repair if needed, and release
        if: steps.check.outputs.result == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_SYNC_SSH_KEY: ${{ secrets.FORK_SYNC_SSH_KEY }}
          RETRY_NIGHTLY: ${{ inputs.retry }}
        run: |
          cp .github/scripts/sync-fork-nightly.cjs "$RUNNER_TEMP/sync-fork-nightly.cjs"
          node "$RUNNER_TEMP/sync-fork-nightly.cjs"
      - name: Retain failure and repair logs
        if: always() && steps.check.outputs.result == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-nightly-logs
          if-no-files-found: ignore
          retention-days: 14
